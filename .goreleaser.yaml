version: 2
project_name: aakb
builds:
  - main: ./cmd/aakb
    binary: aakb
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/bjoernaagaard/aakb/internal/mcpserver.Version={{.Version}} -X github.com/bjoernaagaard/aakb/internal/openalex.Version={{.Version}}
archives:
  - format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: checksums.txt
